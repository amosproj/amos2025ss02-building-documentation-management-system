server {
  listen 80;
  server_name localhost amos.b-iq.net;

  # The built Angular app is in /usr/share/nginx/html/browser
  root /usr/share/nginx/html/browser;
  index index.html;

  # Serve env.js file separately from /usr/share/nginx/html/assets
  #location /assets/env.js {
  #  alias /usr/share/nginx/html/assets/env.js;
  #}

  # Let Angular handle routing
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /usr/share/nginx/html/browser;
    autoindex off;
    try_files $uri =404;
}

  location /api/ {
    proxy_pass http://backend:5001;
  } 

  location /ollama/ {
    proxy_pass http://ollama:8000;
  }
  
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    root /usr/share/nginx/html;
  }
}
