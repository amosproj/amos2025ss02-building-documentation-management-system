server {
  listen 80;
  server_name localhost;

  # The built Angular app is in /usr/share/nginx/html/browser
  root /usr/share/nginx/html/browser;
  index index.html;

  # Serve env.js file separately from /usr/share/nginx/html/assets
  location /assets/env.js {
    alias /usr/share/nginx/html/assets/env.js;
  }

  # Let Angular handle routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
