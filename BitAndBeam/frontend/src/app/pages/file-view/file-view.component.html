<!-- file-view.component.html -->
<div class="layout">
  <app-sidebar>  </app-sidebar>
  <div class="main-area">
    <div class="file-view-container">

      <!-- Not Found Message -->
      <div *ngIf="notFound" class="not-found">
        <p>Document Not Found</p>
      </div>

      <!-- Main File Content -->
      <div class="file-main-content" *ngIf="selectedFile">

        <!-- PDF Viewer -->
         <!-- Updated PDF viewer to ngx-extended-pdf-viewer (ng2 version broke under Vite) -->
        <section class="pdf-viewer">
            <ngx-extended-pdf-viewer
              *ngIf="selectedFile?.url"
              [src]="selectedFile.url"
              useBrowserLocale="true"
              height="100%"
              [showSidebarButton]="true"
              [showToolbar]="true"
            >
            </ngx-extended-pdf-viewer>


        </section>

        <!-- Metadata Panel-->
        <aside class="metadata-panel">
          <h3>Metadata</h3>

          <div class="metadata-item" *ngFor="let meta of selectedFile.metadata">
            <strong>{{ meta.label }}:</strong> {{ meta.value }}
          </div>

          <div class="meta-actions">
            <button class="download-btn" (click)="downloadFile()">Download</button>
            <button class="delete-btn" (click)="deleteFile()">Delete</button>
          </div>
        </aside>

        </div>
      </div>
    </div>
  </div>
