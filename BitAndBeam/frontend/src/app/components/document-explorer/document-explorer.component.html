<div class="document-explorer">
  <h2>📂 Document Explorer</h2>

  <div *ngIf="buildingDocumentGroups">
    <div *ngFor="let group of buildingDocumentGroups">
      <h3>{{ group.buildingName }}</h3>
      <ul>
        <li *ngFor="let doc of group.documents">
          <a [routerLink]="['/documents', doc.documentId]" style="cursor: pointer;">
            📄 {{ doc.title || doc.fileName }}
          </a>
        </li>
      </ul>
    </div>
  </div>>
</div>
