services:
  reverse-proxy:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--log.level=INFO"
      - "--providers.docker=true" 
      - "--providers.file.directory=/etc/traefik"  # better than filename
      - "--providers.file.watch=true"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure" 
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https" 
      - "--certificatesresolvers.le.acme.email=ouabosamuel10@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--api.dashboard=true"
      - "--api.insecure=true"    # for testing, allows access on port 8080
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"  # required for dashboard!
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      - "./traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yml:ro"
      - "/home/samuel/BitAndBeam/letsencrypt:/letsencrypt"
    labels:
      - "traefik.enable=true" 
    


  tika:
    build:
      context: ./tika
      dockerfile: Dockerfile
    container_name: tika
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped    
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile 
    depends_on:
      - postgres
      - ollama
      - tika
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=bitandbeam;Username=postgres;Password=postgres
      - Tika__ServerUrl=http://tika:9998
    volumes:
      - documentdata:/app/documents
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"

  frontend:
    image: ghcr.io/amosproj/bitandbeam-frontend:latest
    restart: always
    environment:
      - API_URL=https://amos.b-iq.net/api
    depends_on:
      - backend
    volumes:
      - /home/samuel/BitAndBeam/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`amos.b-iq.net`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"


    

  ollama:
    image: ghcr.io/amosproj/bitandbeam-ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=PathPrefix(`/ollama`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls.certresolver=le"
      - "traefik.http.services.ollama.loadbalancer.server.port=8000"

  postgres:
    image: postgres:17
    container_name: bitandbeam_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - .:/app
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitandbeam

volumes:
  documentdata:
  pgdata: